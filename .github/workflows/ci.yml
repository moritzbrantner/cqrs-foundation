name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore cqrs-foundation.slnx
      - run: dotnet build cqrs-foundation.slnx --configuration Release --no-restore
      - run: dotnet test cqrs-foundation.slnx --configuration Release --no-build
