name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: merge-ready
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_DB: cqrs_foundation_test
          POSTGRES_USER: cqrs
          POSTGRES_PASSWORD: cqrs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cqrs -d cqrs_foundation_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      TEST_POSTGRES: Host=localhost;Port=5432;Database=cqrs_foundation_test;Username=cqrs;Password=cqrs
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - run: dotnet restore cqrs-foundation.slnx
      - run: dotnet build cqrs-foundation.slnx --configuration Release --no-restore
      - run: dotnet test cqrs-foundation.slnx --configuration Release --no-build
