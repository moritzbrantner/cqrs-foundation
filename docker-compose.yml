services:
  postgres:
    image: postgres:17-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
    environment:
      POSTGRES_DB: cqrs_foundation
      POSTGRES_USER: cqrs
      POSTGRES_PASSWORD: cqrs
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cqrs -d cqrs_foundation"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
