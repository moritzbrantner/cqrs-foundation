services:
  postgres:
    image: postgres:17-alpine@sha256:d3244e8ce3f165ee3c93d9c4a4b1d0fe48b3a89e2287b717fdcbbde92d405065
    environment:
      POSTGRES_DB: cqrs_foundation
      POSTGRES_USER: cqrs
      POSTGRES_PASSWORD: cqrs
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cqrs -d cqrs_foundation"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
